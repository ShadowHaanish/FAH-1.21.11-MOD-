name: Build mod jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0
      - name: Find the 1.21.11 project folder
        run: |
          F=$(grep -rl --include=gradle.properties 'minecraft_version=1.21.11' . | head -1)
          echo "MODDIR=$(dirname "$F")" >> $GITHUB_ENV
      - name: Build
        working-directory: ${{ env.MODDIR }}
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: visual-modules-1.21.11-jar
          path: ${{ env.MODDIR }}/build/libs/visual-modules-1.21.11-1.0.0.jar
